[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomechanics-pedicle-planning"
version = "0.2.0"
description = "A CT- and geometry-based computational planning research prototype for pedicle screw placement."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "SimpleITK",
    "pyvista",
    "vtk",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
